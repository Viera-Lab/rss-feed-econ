name: econ-alerts

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

concurrency:
  group: econ-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - run: pip install -r requirements-actions.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Run checks
        run: python run_once.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_ROLE_ID: ${{ secrets.ALERT_ROLE_ID }}
          DB_PATH: state/bot.sqlite3
          TIMEZONE: Asia/Jakarta
          CAL_CURRENCIES: USD
          CAL_ALERT_IMPACTS: High
          CAL_ALERT_LEAD_MINUTES: "45,15"
          BRIEFING_HOUR: "7"
          GEO_THRESHOLD: "5"
          GEO_MAX_AGE_HOURS: "3"
          IPO_ALERT_HOUR: "8"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
